<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boceto botón Ver mis números</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilo.css">
<style>
  .opcion { margin: 18px 0; }
  .opcion h2 { margin: 0 0 8px; font-size: 15px; }
  .opcion .producto { margin-top: 0; }
  .demo-boton { font-weight: 700; }
  .a { color: #fff; background: #0F172A; }
  .b { color: var(--verde-osc); background: #fff; border: 2px solid var(--verde); }
  .c { color: #fff; background: var(--naranja); }
  .actual { color: var(--verde-osc); background: var(--verde-claro); }
</style>
</head>
<body>
<main class="contenedor">

  <section class="opcion">
    <h2>Cómo está ahora</h2>
    <div class="producto"><div class="producto-cuerpo">
      <a class="boton">🎟️ Elegir mis chances</a>
      <a class="boton-sec demo-boton actual" style="font-weight:600">Ya compré: ver mis números</a>
    </div></div>
  </section>

  <section class="opcion">
    <h2>Opción A: azul oscuro</h2>
    <div class="producto"><div class="producto-cuerpo">
      <a class="boton">🎟️ Elegir mis chances</a>
      <a class="boton-sec demo-boton a">Ya compré: ver mis números</a>
    </div></div>
  </section>

  <section class="opcion">
    <h2>Opción B: borde verde</h2>
    <div class="producto"><div class="producto-cuerpo">
      <a class="boton">🎟️ Elegir mis chances</a>
      <a class="boton-sec demo-boton b">Ya compré: ver mis números</a>
    </div></div>
  </section>

  <section class="opcion">
    <h2>Opción C: naranja</h2>
    <div class="producto"><div class="producto-cuerpo">
      <a class="boton">🎟️ Elegir mis chances</a>
      <a class="boton-sec demo-boton c">Ya compré: ver mis números</a>
    </div></div>
  </section>

</main>
</body>
</html>
