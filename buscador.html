<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sub admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --fondo: #f3f4f7;
    --tarjeta: #ffffff;
    --borde: #e3e5ea;
    --texto: #111827;
    --suave: #6b7280;
    --verde: #00a650;
    --naranja: #ff6a00;
    --rojo: #dc2626;
    --oscuro: #0f172a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Inter, system-ui, sans-serif;
    color: var(--texto);
    background: var(--fondo);
  }

  .contenedor { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }

  h1 { margin: 0 0 4px; font-size: 22px; }

  .bajada { margin: 0 0 18px; font-size: 14px; color: var(--suave); }

  .caja {
    padding: 18px;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 16px;
  }

  button {
    font: inherit;
    font-weight: 700;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }

  .boton {
    width: 100%;
    padding: 14px;
    color: #fff;
    background: var(--oscuro);
  }

  .boton:disabled { opacity: .6; }

  #formEntrar { flex-direction: column; }

  .sesion {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--suave);
  }

  .sesion button { padding: 6px 10px; color: var(--texto); background: var(--borde); }

  form { display: flex; gap: 8px; }

  input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    font: inherit;
    border: 1px solid var(--borde);
    border-radius: 12px;
  }

  form button { padding: 0 18px; color: #fff; background: var(--verde); }

  .aviso { margin: 14px 0 0; font-size: 14px; color: var(--suave); }

  .aviso.error { color: var(--rojo); }

  .compra {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    gap: 12px;
    align-items: center;
    margin-top: 10px;
    padding: 12px;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 14px;
  }

  .compra a, .sin-foto {
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    overflow: hidden;
    font-size: 11px;
    color: var(--suave);
    background: var(--fondo);
    border-radius: 10px;
  }

  .compra img { width: 100%; height: 100%; object-fit: cover; }

  .compra b { display: block; font-size: 15px; }

  .compra span { display: block; margin-top: 2px; font-size: 13px; color: var(--suave); overflow-wrap: anywhere; }

  .estado {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 999px;
    color: var(--naranja);
    background: #fff3e8;
  }

  .estado.pagado { color: var(--verde); background: #e9f8f0; }

  .etiqueta-mano {
    display: inline-block;
    margin: 6px 0 0 6px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 700;
    color: #4338ca;
    background: #eef2ff;
    border-radius: 999px;
  }

  .aprobar {
    display: block;
    margin-top: 8px;
    padding: 9px 12px;
    font-size: 13px;
    color: #fff;
    background: var(--verde);
  }

  .aprobar:disabled { opacity: .6; }

  /* Pestañas Buscar / Cargar */
  .pestanas { display: flex; gap: 8px; margin-bottom: 12px; }

  .pestanas button {
    flex: 1;
    padding: 11px;
    color: var(--texto);
    background: var(--borde);
  }

  .pestanas button[aria-selected="true"] { color: #fff; background: var(--oscuro); }

  /* Cargar una compra a mano */
  #formCargar { display: grid; gap: 10px; }

  #formCargar label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }

  #formCargar select,
  #formCargar input { width: 100%; padding: 12px; font: inherit; font-weight: 400; border: 1px solid var(--borde); border-radius: 12px; background: #fff; }

  .dos-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .nota { margin: 0; font-size: 12px; color: var(--suave); }

  [hidden] { display: none !important; }
</style>
</head>

<body>

<main class="contenedor">

  <h1>🔎 Sub admin</h1>
  <p class="bajada">Buscá compras por DNI o nombre, y cargá la de quien no pudo hacerlo.</p>

  <!-- ===== ENTRAR ===== -->
  <section class="caja" id="entrar">
    <form id="formEntrar">
      <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit" class="boton">Entrar</button>
    </form>
    <p class="aviso" id="avisoEntrar" hidden></p>
  </section>

  <!-- ===== BUSCADOR ===== -->
  <section id="buscar" hidden>

    <div class="sesion">
      <span>Sesión abierta en este dispositivo</span>
      <button type="button" id="botonSalir">Salir</button>
    </div>

    <div class="pestanas" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-pestana="panelBuscar">🔎 Buscar</button>
      <button type="button" role="tab" aria-selected="false" data-pestana="panelCargar">➕ Cargar compra</button>
    </div>

    <!-- Buscar -->
    <div id="panelBuscar">

      <div class="caja">
        <form id="formulario">
          <input id="texto" type="search" placeholder="DNI o nombre" autocomplete="off" required>
          <button type="submit">Buscar</button>
        </form>
      </div>

      <p class="aviso" id="avisoBuscar" hidden></p>
      <div id="resultados"></div>

    </div>

    <!-- Cargar una compra a mano -->
    <div id="panelCargar" hidden>

      <div class="caja">
        <form id="formCargar">

          <label>
            Chances
            <select id="cargarPack" required>
              <option value="">Cargando packs...</option>
            </select>
          </label>

          <div class="dos-columnas">
            <label>Nombre <input id="cargarNombre" maxlength="80" required></label>
            <label>Apellido <input id="cargarApellido" maxlength="80" required></label>
          </div>

          <div class="dos-columnas">
            <label>DNI <input id="cargarDni" inputmode="numeric" maxlength="12" required></label>
            <label>Teléfono <input id="cargarTelefono" type="tel" maxlength="40" required></label>
          </div>

          <label>Instagram (opcional) <input id="cargarInstagram" maxlength="80" placeholder="@usuario"></label>

          <label>
            Comprobante
            <input id="cargarArchivo" type="file" accept="image/*,application/pdf" required>
          </label>

          <button type="submit" class="boton">Cargar compra</button>

          <p class="nota">Queda pendiente. Después la aprobás desde el resultado que aparece abajo.</p>

        </form>

        <p class="aviso" id="avisoCargar" hidden></p>
      </div>

    </div>

  </section>

</main>

<script type="module">
  import { subirComprobante } from "./storage.js";

  // =====================================================
  // SESIÓN
  // =====================================================
  // La contraseña la controla el servidor (secreto CLAVE_BUSCADOR).
  // Queda guardada en este dispositivo hasta tocar "Salir".

  const entrar = document.getElementById("entrar");
  const buscar = document.getElementById("buscar");
  const avisoEntrar = document.getElementById("avisoEntrar");
  const avisoBuscar = document.getElementById("avisoBuscar");
  const resultados = document.getElementById("resultados");

  const GUARDADA = "buscadorClave";

  let clave = "";
  try { clave = localStorage.getItem(GUARDADA) || ""; } catch {}

  function avisar(lugar, mensaje, esError = false) {
    lugar.hidden = !mensaje;
    lugar.textContent = mensaje;
    lugar.classList.toggle("error", esError);
  }

  function mostrar() {
    entrar.hidden = Boolean(clave);
    buscar.hidden = !clave;
    resultados.innerHTML = "";
    avisar(avisoBuscar, "");
  }

  function cerrarSesion(mensaje = "") {
    clave = "";
    try { localStorage.removeItem(GUARDADA); } catch {}
    mostrar();
    avisar(avisoEntrar, mensaje, Boolean(mensaje));
  }

  async function pedir(cuerpo) {
    const respuesta = await fetch("/api/buscar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo)
    });
    const datos = await respuesta.json().catch(() => ({}));
    return { ok: respuesta.ok, datos };
  }

  document.getElementById("formEntrar").addEventListener("submit", async (evento) => {

    evento.preventDefault();

    const campo = document.getElementById("clave");
    const boton = evento.submitter;

    if (boton) boton.disabled = true;
    avisar(avisoEntrar, "Entrando...");

    try {

      const { ok, datos } = await pedir({ clave: campo.value, entrar: true });

      if (!ok) {
        avisar(avisoEntrar, MENSAJES[datos.error] || "No se pudo entrar. Probá de nuevo.", true);
        return;
      }

      clave = campo.value;
      try { localStorage.setItem(GUARDADA, clave); } catch {}
      campo.value = "";
      avisar(avisoEntrar, "");
      mostrar();

    } catch {

      avisar(avisoEntrar, "No se pudo entrar. Revisá la conexión.", true);

    } finally {

      if (boton) boton.disabled = false;

    }

  });

  document.getElementById("botonSalir").addEventListener("click", () => cerrarSesion());

  // =====================================================
  // BUSCAR
  // =====================================================

  const MENSAJES = {
    CLAVE: "Contraseña incorrecta.",
    BLOQUEADO: "Demasiados intentos. Esperá 15 minutos y probá de nuevo.",
    CORTO: "Escribí un DNI completo o al menos 3 letras del nombre.",
    CERRADO: "Las compras ya están cerradas.",
    DATOS: "Revisá los datos: falta alguno o el DNI no es válido.",
    SIN_COMPROBANTE: "No llegó el comprobante. Probá de nuevo.",
    NO_PERMITIDA: "Solo podés aprobar las compras que cargaste vos.",
    YA_APROBADA: "Esa compra ya estaba aprobada."
  };

  // Contraseña cambiada o bloqueo: vuelve a pedirla
  function sesionVencida(datos) {
    if (datos.error === "CLAVE" || datos.error === "BLOQUEADO") {
      cerrarSesion(MENSAJES[datos.error]);
      return true;
    }
    return false;
  }

  const fechaArgentina = (ms) =>
    ms
      ? new Date(ms).toLocaleString("es-AR", {
          timeZone: "America/Argentina/Buenos_Aires",
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }) + " h"
      : "Sin fecha";

  function tarjeta(compra) {

    const fila = document.createElement("article");
    fila.className = "compra";

    if (compra.comprobante) {
      const enlace = document.createElement("a");
      enlace.href = compra.comprobante;
      enlace.target = "_blank";
      enlace.rel = "noopener";
      const imagen = document.createElement("img");
      imagen.src = compra.comprobante;
      imagen.alt = "Comprobante";
      imagen.loading = "lazy";
      // Si es un PDF no se ve la miniatura: queda el texto
      imagen.addEventListener("error", () => { enlace.textContent = "Ver archivo"; });
      enlace.appendChild(imagen);
      fila.appendChild(enlace);
    } else {
      const vacio = document.createElement("div");
      vacio.className = "sin-foto";
      vacio.textContent = "Sin comprobante";
      fila.appendChild(vacio);
    }

    const info = document.createElement("div");

    const nombre = document.createElement("b");
    nombre.textContent = compra.nombre || "Sin nombre";

    const dni = document.createElement("span");
    dni.textContent = `DNI ${compra.dni || "-"} · ${fechaArgentina(compra.fecha)}`;

    const pack = document.createElement("span");
    pack.textContent = compra.pack || "-";

    const estado = document.createElement("i");
    const pagado = compra.estado === "Pagado";
    estado.className = "estado" + (pagado ? " pagado" : "");
    estado.style.fontStyle = "normal";
    estado.textContent = pagado
      ? `Aprobado${compra.cantidadNumeros ? ` · ${compra.cantidadNumeros} números` : ""}`
      : "Pendiente";

    info.append(nombre, dni, pack, estado);

    if (compra.cargadaAMano) {
      const etiqueta = document.createElement("i");
      etiqueta.className = "etiqueta-mano";
      etiqueta.style.fontStyle = "normal";
      etiqueta.textContent = "Cargada por vos";
      info.appendChild(etiqueta);
    }

    // Solo las que cargó el sub admin y siguen pendientes
    if (compra.cargadaAMano && !pagado) {

      const aprobar = document.createElement("button");
      aprobar.type = "button";
      aprobar.className = "aprobar";
      aprobar.textContent = "✅ Aprobar pago";

      aprobar.addEventListener("click", async () => {

        if (!confirm(`¿Aprobar la compra de ${compra.nombre}?\n\n${compra.pack}\n\nSe le asignan los números.`)) {
          return;
        }

        aprobar.disabled = true;
        aprobar.textContent = "⏳ Generando números...";

        try {

          const { ok, datos } = await pedir({ clave, accion: "aprobar", id: compra.id });

          if (sesionVencida(datos)) return;

          if (!ok) {
            alert("❌ " + (MENSAJES[datos.error] || "No se pudo aprobar. Probá de nuevo."));
          } else {
            alert(`✅ Pago aprobado.\n\nSe asignaron ${datos.cantidad} números.`);
          }

          await buscarTexto(compra.dni);

        } catch {

          alert("❌ No se pudo aprobar. Revisá la conexión.");
          aprobar.disabled = false;
          aprobar.textContent = "✅ Aprobar pago";

        }

      });

      info.appendChild(aprobar);

    }

    fila.appendChild(info);

    return fila;

  }

  async function buscarTexto(texto) {

    document.getElementById("texto").value = texto;

    resultados.innerHTML = "";
    avisar(avisoBuscar, "Buscando...");

    try {

      const { ok, datos } = await pedir({ clave, texto });

      if (sesionVencida(datos)) return;

      if (!ok) {
        avisar(avisoBuscar, MENSAJES[datos.error] || "No se pudo buscar. Probá de nuevo.", true);
        return;
      }

      if (!datos.compras.length) {
        avisar(avisoBuscar, "No se encontró ninguna compra.");
        return;
      }

      avisar(
        avisoBuscar,
        datos.hayMas
          ? `Se muestran las ${datos.compras.length} más recientes. Escribí más para achicar la búsqueda.`
          : `${datos.compras.length} compra${datos.compras.length === 1 ? "" : "s"}`
      );

      datos.compras.forEach((compra) => resultados.appendChild(tarjeta(compra)));

    } catch (error) {

      avisar(avisoBuscar, "No se pudo buscar. Revisá la conexión.", true);

    }

  }

  document.getElementById("formulario").addEventListener("submit", async (evento) => {

    evento.preventDefault();

    const boton = evento.submitter;

    if (boton) boton.disabled = true;
    await buscarTexto(document.getElementById("texto").value.trim());
    if (boton) boton.disabled = false;

  });


  // =====================================================
  // PESTAÑAS
  // =====================================================

  const pestanas = document.querySelectorAll("[data-pestana]");

  function abrirPestana(id) {
    pestanas.forEach((boton) => {
      const activa = boton.dataset.pestana === id;
      boton.setAttribute("aria-selected", String(activa));
      document.getElementById(boton.dataset.pestana).hidden = !activa;
    });
    if (id === "panelCargar") cargarPacks();
  }

  pestanas.forEach((boton) =>
    boton.addEventListener("click", () => abrirPestana(boton.dataset.pestana))
  );


  // =====================================================
  // CARGAR UNA COMPRA A MANO
  // =====================================================
  // Los packs (comunes, 50% OFF y ruleta) los manda el servidor,
  // con sus precios: si cambian allá, cambian acá solos.

  const selectorPack = document.getElementById("cargarPack");
  const avisoCargar = document.getElementById("avisoCargar");
  let packsListos = false;

  async function cargarPacks() {

    if (packsListos) return;

    try {

      const { ok, datos } = await pedir({ clave, accion: "packs" });

      if (sesionVencida(datos) || !ok) return;

      selectorPack.innerHTML = '<option value="">Elegí las chances</option>';

      const grupos = new Map();

      datos.packs.forEach(({ id, grupo, texto }) => {
        if (!grupos.has(grupo)) {
          const nuevo = document.createElement("optgroup");
          nuevo.label = grupo;
          grupos.set(grupo, nuevo);
          selectorPack.appendChild(nuevo);
        }
        const opcion = document.createElement("option");
        opcion.value = id;
        opcion.textContent = texto;
        grupos.get(grupo).appendChild(opcion);
      });

      packsListos = true;

      if (!datos.abierto) {
        avisar(avisoCargar, MENSAJES.CERRADO, true);
      }

    } catch {

      selectorPack.innerHTML = '<option value="">No se pudieron cargar los packs</option>';

    }

  }

  document.getElementById("formCargar").addEventListener("submit", async (evento) => {

    evento.preventDefault();

    const formulario = evento.currentTarget;
    const boton = evento.submitter;
    const archivo = document.getElementById("cargarArchivo").files[0];
    const valor = (id) => document.getElementById(id).value.trim();

    if (!archivo) {
      avisar(avisoCargar, "Elegí la foto del comprobante.", true);
      return;
    }

    if (boton) boton.disabled = true;

    try {

      avisar(avisoCargar, "Subiendo comprobante... 0%");

      const subido = await subirComprobante(archivo, (porcentaje) => {
        avisar(avisoCargar, `Subiendo comprobante... ${Math.round(porcentaje)}%`);
      });

      avisar(avisoCargar, "Guardando la compra...");

      const dni = valor("cargarDni");

      const { ok, datos } = await pedir({
        clave,
        accion: "cargar",
        packId: selectorPack.value,
        nombre: valor("cargarNombre"),
        apellido: valor("cargarApellido"),
        dni,
        telefono: valor("cargarTelefono"),
        instagram: valor("cargarInstagram"),
        comprobantePath: subido.path
      });

      if (sesionVencida(datos)) return;

      if (!ok) {
        avisar(avisoCargar, MENSAJES[datos.error] || "No se pudo cargar. Probá de nuevo.", true);
        return;
      }

      formulario.reset();
      avisar(avisoCargar, "");

      // Muestra la compra recién cargada, lista para aprobar
      abrirPestana("panelBuscar");
      await buscarTexto(dni);

    } catch (error) {

      avisar(avisoCargar, "No se pudo subir el comprobante. Revisá la conexión y probá de nuevo.", true);

    } finally {

      if (boton) boton.disabled = false;

    }

  });

  mostrar();
</script>

</body>
</html>
