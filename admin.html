<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Admin</title>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div id="loginAdmin">

  <h1>Panel Administrador</h1>

  <input
    type="password"
    id="passwordAdmin"
    placeholder="Contraseña"
  >

  <button id="btnLogin">
    Entrar
  </button>

</div>

<div id="panelAdmin" style="display:none;">

<h1>Participantes</h1>

<button id="cerrarSesion">
  CERRAR SESIÓN
</button>

<button id="exportarSorteo">
  EXPORTAR SORTEO
</button>

<button id="aprobarTodos">
  ✅ APROBAR TODOS
</button>

<button id="borrarTodo">
  🗑 BORRAR TODO EL SORTEO
</button>

<p id="totalParticipantes">
  Participantes únicos: 0
</p>

<p id="recaudacionTotal">
  Recaudación estimada: $0
</p>

<input
  type="text"
  id="buscador"
  placeholder="Buscar por nombre, apellido o DNI"
>

<h2 id="tituloPendientes">
  Pagos pendientes (0)
</h2>
<div id="pendientes"></div>

<h2 id="tituloPagados">
  Pagos aprobados (0)
</h2>
<div id="pagados"></div>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<script type="module" src="admin.js"></script>

</div>

</body>
</html>
